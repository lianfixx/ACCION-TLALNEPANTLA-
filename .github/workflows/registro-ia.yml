name: Registro y reglas entre IA

# Revisa todo push y pull request, venga de la IA que venga (Claude, ChatGPT, Codex, Gemini,
# conectores web o personas): registro en cada commit, secretos, archivos inmutables,
# compatibilidad de la skill y vigencia de ia/REGLAS.md. Ver ia/PROTOCOLO.md.
# Aplica el código y la política de ia/ tal como estaban en la base, para que un push no pueda
# desactivar las reglas que él mismo incumple.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verificar registro, secretos y skill con las reglas de la base
        env:
          EVENT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base="${EVENT_BASE:-}"
          runner="ia/verificar.py"; politica="ia/politica.json"
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "$base:ia/verificar.py" 2>/dev/null \
             && git show "$base:ia/verificar.py" | grep -q -- "--politica"; then
            mkdir -p "$RUNNER_TEMP/ia-base"
            for f in guard.py verificar.py check_skill.py politica.json; do
              git show "$base:ia/$f" > "$RUNNER_TEMP/ia-base/$f"
            done
            runner="$RUNNER_TEMP/ia-base/verificar.py"; politica="$RUNNER_TEMP/ia-base/politica.json"
            echo "Reglas de la base $base"
          else
            echo "La base no tiene ia/ (primera instalación): se usan las reglas de este commit."
          fi
          python3 "$runner" ci --root "$PWD" --politica "$politica" --base "$base" --head "$GITHUB_SHA"
